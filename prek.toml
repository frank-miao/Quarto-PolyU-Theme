minimum_prek_version = "0.4.0"
default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-toml" },
  { id = "check-yaml" },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "cocogitto-commit-msg"
name = "cocogitto commit message"
entry = "mise x -- cog verify --file"
language = "system"
stages = ["commit-msg"]
always_run = true
